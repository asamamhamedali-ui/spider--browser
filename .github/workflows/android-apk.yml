name: Spider Browser - Fast Android APK[cite: 1]

on:
  push:
    branches: [main, master][cite: 1]
  workflow_dispatch:[cite: 1]

permissions:
  contents: read[cite: 1]

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest[cite: 1]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4[cite: 1]

      - name: Set up Node.js with Cache
        uses: actions/setup-node@v4[cite: 1]
        with:
          node-version: 22[cite: 1]
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4[cite: 1]
        with:
          distribution: temurin[cite: 1]
          java-version: '17'[cite: 1]

      - name: Setup Gradle with Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean[cite: 1]

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew[cite: 1]

      - name: Build Debug APK
        working-directory: android[cite: 1]
        run: ./gradlew assembleDebug --no-daemon --parallel

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4[cite: 1]
        with:
          name: spider-browser-debug-apk[cite: 1]
          path: android/app/build/outputs/apk/debug/app-debug.apk[cite: 1]
          if-no-files-found: error[cite: 1]
          retention-days: 7
